[item-description]
spidertron-enhancements-spidertron-remote-append=__1__\n[font=default-semibold][color=255, 230, 192]When in cursor:\n  •   __CONTROL__spidertron-enhancements-open-vehicle-inventory__ to open vehicle inventory.\n  •   __ALT_CONTROL__1__stack-split__ to reset.[/color][/font]__2__
spidertron-enhancements-spidertron-remote-append-pathfinder=\n[font=default-semibold][color=255, 230, 192]  •   __ALT_CONTROL__1__spidertron-enhancements-use-alt-spidertron-remote__ to send vehicle with pathfinding.[/color][/font] 

[controls]
spidertron-enhancements-use-alt-spidertron-remote=Order vehicle with pathfinder
spidertron-enhancements-enter-vehicles=Toggle vehicle driving
spidertron-enhancements-spidertron-pipette=Vehicle pipette tool
spidertron-enhancements-spidertron-patrol-pipette=Vehicle patrol pipette tool
spidertron-enhancements-recall-shortcut=Call last used vehicle

[controls-description]
spidertron-enhancements-use-alt-spidertron-remote=Used with Remote control to order the connected vehicle using the pathfinder.
spidertron-enhancements-spidertron-pipette=Picks a Remote from your inventory that is connected to the currently selected vehicle and places it in your cursor.\nIf no currently selected vehicle, picks a remote connected to the vehicle you are currently driving.
spidertron-enhancements-spidertron-patrol-pipette=Only functional when Spidertron Patrols is installed.\nPicks a Patrol remote from your inventory that is connected to the currently selected vehicle and places it in your cursor.\nIf no currently selected vehicle, picks a patrol remote connected to the vehicle you are currently driving.
spidertron-enhancements-open-vehicle-inventory=If holding a Remote control, opens the inventory of the connected vehicle.\nOtherwise, opens the inventory of the vehicle you are currently driving.

[shortcut-name]
spidertron-enhancements-recall-shortcut=Call last used vehicle

[mod-setting-name]
spidertron-enhancements-enable-corpse=Save vehicle inventory upon destruction [img=info]
spidertron-enhancements-increase-size=Increase spidertron size [img=info]
spidertron-enhancements-sound-pause=Spidertron sound average pause [img=info]
spidertron-enhancements-volume-scale=Spidertron sound volume scale [img=info]

spidertron-enhancements-enter-entity=Enter/exit tank or non-DMV vehicle from spidertron or DMV vehicle with __CONTROL__toggle-driving__ or __CONTROL__spidertron-enhancements-enter-vehicles__ [img=info]
spidertron-enhancements-show-spider-on-vehicle=Show Spidertron or DMV vehicle on top of tank or non-DMV vehicle after entering from a spidertron or DMV vehicle
spidertron-enhancements-enter-player=Quick toggle vehicle with __CONTROL__spidertron-enhancements-enter-vehicles__
spidertron-enhancements-auto-sort-inventory=Automatically sort vehicle inventories
spidertron-enhancements-pipette-temporary-remote=Vehicle pipette (__CONTROL__spidertron-enhancements-spidertron-pipette__) picks temporary remote instead of from inventory

spidertron-enhancements-enter-entity-base-game=Enter/exit tank or non-DMV vehicle from spidertron or DMV vehicle with standard control __CONTROL__toggle-driving__ [img=info]
spidertron-enhancements-enter-entity-custom=Enter/exit tank or non-DMV vehicle from spidertron or DMV vehicle with custom control __CONTROL__spidertron-enhancements-enter-vehicles__ [img=info]
spidertron-enhancements-pipette-unconnected-remote=Vehicle pipette (__CONTROL__spidertron-enhancements-spidertron-pipette__) picks an unconnected remote if no connected remotes are found [img=info]

[string-mod-setting]
spidertron-enhancements-enter-entity-none=None
spidertron-enhancements-enter-entity-trains=Trains only
spidertron-enhancements-enter-entity-all-except-spidertrons=All except spidertrons and DMV vehicles
spidertron-enhancements-enter-entity-all=All


[mod-setting-description]
spidertron-enhancements-enable-corpse=[color=green]Default = On[/color]
spidertron-enhancements-increase-size=[color=red]Loading a save after changing this setting requires all spidertrons to be mined and rebuilt.[/color]\n[color=green]Default = Off[/color]
spidertron-enhancements-sound-pause=Average number of seconds before a spidertron's sound starts playing again (sound plays for 19s).\n[color=green]Default = 0[/color]
spidertron-enhancements-volume-scale=[color=green]Default = 1[/color]

spidertron-enhancements-enter-entity=Configure controls in [font=default-bold]Per player[/font] settings tab.

spidertron-enhancements-enter-entity-base-game=Overrides the default behaviour for __CONTROL__toggle-driving__ when riding a spidertron or DMV vehicle near a tank or non-DMV vehicle.\nDepends on "Enter/exit tank or non-DMV vehicle from spidertron or DMV vehicle" [font=default-bold]Map[/font] setting.
spidertron-enhancements-enter-entity-custom=Depends on "Enter/exit tank or non-DMV vehicle from spidertron or DMV vehicle" [font=default-bold]Map[/font] setting.
spidertron-enhancements-pipette-unconnected-remote=Depends on "Vehicle pipette picks temporary remote instead of from inventory" [font=default-bold]Map[/font] setting.

[entity-name]
spidertron-enhancements-corpse=Vehicle remnants

[cursor-message]
spidertron-enhancements-entity-not-spidertron=Entity is not a spidertron or DMV vehicle
spidertron-enhancements-no-last-spidertron=Last used vehicle not found

spidertron-enhancements-player-contains-spidertron=Player already contains a vehicle


[tips-and-tricks-item-name]
spidertron-enhancements=Spidertron Enhancements
spidertron-enhancements-enter-train=Enter tank or non-DMV vehicle from spidertron or DMV vehicle

[tips-and-tricks-item-description]
spidertron-enhancements=This list of tips is experimental and not exhaustive. Please see the mod settings or the mod portal page for a full list of features.
spidertron-enhancements-enter-train=Press __CONTROL__toggle-driving__ and/or __CONTROL__spidertron-enhancements-enter-vehicles__ (depending on settings) whilst near a tank or non-DMV vehicle to enter it.
